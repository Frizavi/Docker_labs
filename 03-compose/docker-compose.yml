services:
  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - web

  web:
    build: ./web
    depends_on:
      - mariadb
      - postgres
      - redis

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: appdb
      MARIADB_USER: appuser
      MARIADB_PASSWORD: apppass

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass

  redis:
    image: redis:alpine