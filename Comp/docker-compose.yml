services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app_net

  php:
    build: ./web
    volumes:
      - ./web:/var/www/html
    depends_on:
      - mysql
      - pgsql
      - redis
    networks:
      - app_net

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    networks:
      - app_net

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    networks:
      - app_net

  redis:
    image: redis:alpine
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
